<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monstrum — Collect. Battle. Evolve.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: rgba(160, 130, 255, 0.15);
      --accent: #a07aff;
      --accent2: #ff7aad;
      --gold: #f5c842;
      --text: #e8e0ff;
      --muted: #7a7090;
      --rare: #4af0c8;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      overflow-x: hidden;
    }

    /* Animated star field background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(160,122,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 10%, rgba(255,122,173,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 80%, rgba(74,240,200,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 60%, rgba(160,122,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 50%, rgba(255,122,173,0.3) 0%, transparent 100%);
      background-size: 400px 300px;
      animation: starfield 60s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes starfield {
      from { background-position: 0 0, 100px 50px, 200px 100px, 50px 150px, 300px 200px; }
      to   { background-position: 400px 300px, 500px 350px, 600px 400px, 450px 450px, 700px 500px; }
    }

    /* Orb glow effects */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: rgba(160, 122, 255, 0.12);
      top: -100px; left: -100px;
      animation: orb-drift 20s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: rgba(255, 122, 173, 0.1);
      bottom: -80px; right: -80px;
      animation: orb-drift 25s ease-in-out infinite alternate-reverse;
    }
    @keyframes orb-drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, 30px); }
    }

    /* Layout */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 420px;
    }

    @media (max-width: 900px) {
      .page { grid-template-columns: 1fr; }
      .hero { display: none; }
    }

    /* Hero side */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 60px;
      gap: 32px;
    }

    .hero-logo {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .hero-tagline {
      font-size: 1.3rem;
      font-weight: 300;
      font-style: italic;
      color: var(--muted);
      line-height: 1.6;
      max-width: 400px;
    }

    .creature-showcase {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .creature-card-preview {
      width: 100px;
      height: 120px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      animation: card-float 4s ease-in-out infinite;
      cursor: default;
    }
    .creature-card-preview:nth-child(2) { animation-delay: -1.3s; }
    .creature-card-preview:nth-child(3) { animation-delay: -2.6s; }

    @keyframes card-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    .creature-card-preview::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 60%, rgba(160,122,255,0.05) 100%);
    }

    .creature-sprite {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .creature-rarity {
      font-size: 10px;
      font-family: 'Crimson Pro', serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .rarity-legendary { color: var(--gold); }
    .rarity-rare { color: var(--rare); }
    .rarity-uncommon { color: var(--accent); }
    .rarity-common { color: var(--muted); }

    .feature-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--surface);
    }

    /* Auth panel */
    .auth-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 48px;
      gap: 0;
      position: relative;
    }

    .auth-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--gold));
    }

    .auth-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .auth-subtitle {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 36px;
      font-style: italic;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      padding: 10px 24px;
      font-family: 'Crimson Pro', serif;
      font-size: 1rem;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: -1px;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Form */
    .form { display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Crimson Pro', serif;
      font-size: 1rem;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      margin-top: 8px;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #7a5aff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .btn-discord {
      padding: 12px;
      background: #5865F2;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Crimson Pro', serif;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-discord:hover { opacity: 0.9; }

    .error-msg {
      color: #ff6b6b;
      font-size: 0.9rem;
      font-style: italic;
      min-height: 1.2em;
      text-align: center;
    }

    .success-msg {
      color: var(--rare);
      font-size: 0.9rem;
      font-style: italic;
      min-height: 1.2em;
      text-align: center;
    }

    .hidden { display: none !important; }
  </style>

</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="page">
    <!-- Hero -->
    <div class="hero">
      <div class="hero-logo">Monstrum</div>
      <p class="hero-tagline">
        Discover new friends. Build your collection.<br />
        Forge bonds and create champions.
      </p>

      <div class="creature-showcase">
        <div class="creature-card-preview">
          <img src="/creature-collection/assets/psychotato_original-BejIQoNY.png" alt="Psychotato" class="creature-sprite" />
          <div class="creature-rarity rarity-legendary">Legendary</div>
        </div>
        <div class="creature-card-preview">

        <div class="creature-card-preview">

    </div>

    <div class="auth-panel">

      <div class="tabs">

      <div id="login-form" class="form">

        <button class="btn-primary" id="login-btn">Enter the World</button>
        <div class="divider"><span>or</span></div>

      <div id="signup-form" class="form hidden">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signup-username" placeholder="DragonMaster99" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>

    </div>
  </div>

</body>
